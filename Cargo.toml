[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["spikes"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.96"
authors = ["Bhargavaram Krishnapur"]
repository = "https://github.com/Codex-Crusader/t-rustable"
publish = false

[workspace.dependencies]
t-rustable-sdk = { path = "crates/t-rustable-sdk" }
t-rustable-core = { path = "crates/t-rustable-core" }
t-rustable-engine = { path = "crates/t-rustable-engine" }
t-rustable-plugin-host = { path = "crates/t-rustable-plugin-host" }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
