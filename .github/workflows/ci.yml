name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  NPM_ALLOWED_LICENSES: "MIT;Apache-2.0;BSD-2-Clause;BSD-3-Clause;ISC;Zlib;MPL-2.0"

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust and the wasm target
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable && rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            .
            mods
      - name: Fetch PDFium
        shell: bash
        run: scripts/fetch-pdfium.sh
      - name: Install the WebKitGTK packages for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev xvfb
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      # Tauri embeds ui/dist into the app, so the UI must build before cargo.
      - name: Check, test, and build the UI
        working-directory: ui
        run: |
          npm ci --ignore-scripts
          npm run check
          npm test
          npm run build
      - run: cargo fmt --all --check
      - run: cargo fmt --all --check --manifest-path mods/Cargo.toml
      # The plugin host tests load the built mods from target/mods/.
      - name: Build the mods
        run: cargo xtask build-mods
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy for the mods (wasm32-unknown-unknown)
        working-directory: mods
        run: cargo clippy --release -- -D warnings
      - run: cargo test --workspace
      # From the root, the mods build for the host platform, so their unit tests can run.
      - name: Unit tests of the mods
        run: cargo test --manifest-path mods/Cargo.toml
      # The app opens a generated PDF, runs the built-in mods through the UI code, saves,
      # and writes a JSON report. A failed step gives exit code 1.
      - run: cargo build -p t-rustable-app
      # The first run exits without closing its session, so the second run must recover it.
      - name: GUI self-test, two runs (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          export T_RUSTABLE_HOME="$RUNNER_TEMP/trhome"
          target/debug/t-rustable-app.exe --self-test
          target/debug/t-rustable-app.exe --self-test
          node .github/scripts/check-recovery.js "$T_RUSTABLE_HOME/log/self-test.json"
      - name: GUI self-test, two runs (Linux, virtual display)
        if: runner.os == 'Linux'
        run: |
          export T_RUSTABLE_HOME="$RUNNER_TEMP/trhome"
          xvfb-run -a target/debug/t-rustable-app --self-test
          xvfb-run -a target/debug/t-rustable-app --self-test
          node .github/scripts/check-recovery.js "$T_RUSTABLE_HOME/log/self-test.json"

  # cargo-deny checks the graph for all targets, so one Linux run covers Windows too.
  # The bans section is the check that fails on HTTP client crates.
  deny:
    name: cargo deny (licenses, bans, advisories, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
      - name: cargo deny for the mods workspace
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          manifest-path: mods/Cargo.toml

  reuse:
    name: REUSE lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0

  npm-licenses:
    name: npm license check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      - run: npm ci --ignore-scripts
      - run: npx --yes license-checker-rseidelsohn@5.0.1 --production --excludePrivatePackages --onlyAllow "$NPM_ALLOWED_LICENSES"

  cla-script:
    name: CLA script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      - run: node --test .github/scripts/cla.test.js

  mod-template:
    name: Mod API and template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust and the wasm target
        run: rustup toolchain install stable --profile minimal && rustup default stable && rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            .
            mods/template
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: wasm-tools@1.262.0
      - name: Parse the WIT package
        run: wasm-tools component wit wit/ > /dev/null
      - name: Build the t-rustable command
        run: |
          cargo build -q --release -p t-rustable-cli
          echo "$PWD/target/release" >> "$GITHUB_PATH"
      - name: Build and pack the template
        run: bash mods/template/build.sh
      - name: Check the manifest JSON Schema against the shared cases
        run: |
          python3 -m pip install --user "jsonschema==4.25.1"
          python3 .github/scripts/check-manifest-schema.py
      - name: Check its imports against its manifest
        run: |
          unzip -p mods/template/com.example.rotate-page-0.1.0.tmod rotate_page.wasm > rotate_page.wasm
          wasm-tools component wit rotate_page.wasm > rotate_page.wit
          cargo run -q -p t-rustable-sdk --example check-mod -- mods/template/manifest.json rotate_page.wit

  fuzz:
    name: Fuzz the .tmod reader
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install nightly Rust
        run: rustup toolchain install nightly --profile minimal
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-fuzz@0.13.2
      - name: Run tmod_read for 120 seconds
        working-directory: fuzz
        run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu tmod_read corpus/tmod_read -- -max_total_time=120 -rss_limit_mb=1024
      - name: Keep the failing input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts

  third-party-licenses:
    name: THIRD_PARTY_LICENSES
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-about@0.9.2
      - name: Fetch PDFium for its license files
        run: scripts/fetch-pdfium.sh
      - run: cargo about generate about.hbs -o THIRD_PARTY_LICENSES
      - name: Add the notices of the native libraries (ADR 0016)
        run: scripts/native-notices.sh >> THIRD_PARTY_LICENSES
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      - name: Add the notices of the npm packages in the UI bundle
        working-directory: ui
        run: |
          npm ci --ignore-scripts
          npm run build
          echo >> ../THIRD_PARTY_LICENSES
          cat dist/third-party-npm.txt >> ../THIRD_PARTY_LICENSES
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: THIRD_PARTY_LICENSES
          path: THIRD_PARTY_LICENSES
