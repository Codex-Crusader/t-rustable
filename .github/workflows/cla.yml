name: CLA

# Uses pull_request_target so that it can write signatures for pull requests from forks.
# It checks out only the base branch and never runs code from the pull request.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  statuses: write

# One run at a time, so two signatures cannot overwrite each other.
concurrency:
  group: cla
  cancel-in-progress: false

jobs:
  cla:
    if: github.event_name == 'pull_request_target' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const run = require(process.env.GITHUB_WORKSPACE + '/.github/scripts/cla.js');
            await run({ github, context, core });
