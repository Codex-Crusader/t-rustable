[package]
name = "t-rustable-app"
description = "Tauri shell for the T-Rustable GUI."
license = "PolyForm-Noncommercial-1.0.0"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = { version = "0.4", features = ["std"] }
tauri = { version = "2.12", features = ["custom-protocol"] }
tauri-plugin-dialog = "2.8"
t-rustable-core.workspace = true
t-rustable-engine.workspace = true
t-rustable-plugin-host.workspace = true
t-rustable-sdk.workspace = true
t-rustable-tmod = { workspace = true, features = ["build"] }

[build-dependencies]
tauri-build = "2.7"

[dev-dependencies]
tempfile = "3"
