[package]
name = "t-rustable-plugin-host"
description = "WASM mod host: bindings, permissions, and limits."
license = "PolyForm-Noncommercial-1.0.0"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
t-rustable-core.workspace = true
t-rustable-engine.workspace = true
t-rustable-sdk = { workspace = true, default-features = false }
t-rustable-tmod.workspace = true
wasmtime = { version = "49", default-features = false, features = ["runtime", "cranelift", "component-model", "call-hook", "std"] }

[dev-dependencies]
t-rustable-engine = { workspace = true, features = ["test-hooks"] }
tempfile = "3"
wat = "1"
