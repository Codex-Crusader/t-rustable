[package]
name = "t-rustable-sdk"
description = "Rust bindings and helpers for T-Rustable mods."
license = "MIT"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["guest"]
# WIT bindings for mods. The host side uses the SDK without this feature.
guest = ["dep:wit-bindgen"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wit-bindgen = { version = "0.63", optional = true }

[lints]
workspace = true
