[package]
name = "t-rustable-cli"
description = "Command line front end for T-Rustable."
license = "PolyForm-Noncommercial-1.0.0"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "t-rustable"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = { version = "0.4", features = ["std"] }
t-rustable-core.workspace = true
t-rustable-engine.workspace = true
t-rustable-plugin-host.workspace = true
t-rustable-sdk.workspace = true
t-rustable-tmod = { workspace = true, features = ["build"] }
tempfile = "3"

[dev-dependencies]
t-rustable-engine = { workspace = true, features = ["test-hooks"] }
