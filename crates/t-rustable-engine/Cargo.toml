[package]
name = "t-rustable-engine"
description = "PDFium and qpdf adapters and the engine actor."
license = "PolyForm-Noncommercial-1.0.0"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# A request that panics on the engine thread. Only for tests of the restart path.
test-hooks = []

[dependencies]
libloading = "0.9"
png = "0.18"
qpdf = { version = "0.3.7", features = ["vendored"] }
serde = { version = "1", features = ["derive", "rc"] }
log = "0.4"

[dev-dependencies]
t-rustable-engine = { path = ".", features = ["test-hooks"] }
