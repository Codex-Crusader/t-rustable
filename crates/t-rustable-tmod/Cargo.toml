[package]
name = "t-rustable-tmod"
description = "Reads, checks, and writes .tmod mod packages."
license = "PolyForm-Noncommercial-1.0.0"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Wraps a core module as a component, for `mods pack` and xtask.
build = ["dep:wit-component", "dep:wasmparser"]

[dependencies]
# Only to select the pure Rust backend (miniz_oxide) for the deflate of `zip`.
flate2 = "1"
sha2 = "0.11"
t-rustable-sdk.workspace = true
wasmparser = { version = "0.262", optional = true }
wit-component = { version = "0.262", optional = true }
zip = { version = "9.0", default-features = false, features = ["deflate-flate2"] }

[dev-dependencies]
tempfile = "3"
