# Built-in mods and test fixture mods, built for wasm32-unknown-unknown.
# Build them with `cargo xtask build-mods` from the repository root.
# The template is not here: it is its own workspace, so authors can copy it.
[workspace]
resolver = "3"
members = [
    "fixtures/batch-only",
    "fixtures/misbehave",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "PolyForm-Noncommercial-1.0.0"
publish = false

[workspace.dependencies]
t-rustable-sdk = { path = "../crates/t-rustable-sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
opt-level = "s"
lto = true
strip = true
