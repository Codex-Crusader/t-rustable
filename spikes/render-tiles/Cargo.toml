[package]
name = "spike-render-tiles"
description = "Spike 1: rendering speed with tiles over a custom URI scheme."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
tauri = { version = "2.12", features = ["custom-protocol"] }
pdfium-render = "0.9.4"
image = { version = "0.25", default-features = false }
png = "0.18"
serde_json = "1"

[build-dependencies]
tauri-build = "2.7"
